<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>연구실에서 살아남기 · Lab Survival</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#1a2233;--fg:#f5f7fb;--gold:#ffc83d;--panel:rgba(10,16,28,.62)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a2233;--fg:#f5f7fb}}
:root[data-theme="dark"]{--bg:#1a2233;--fg:#f5f7fb}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Apple SD Gothic Neo",-apple-system,"Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#tl{top:10px;left:12px;display:flex;flex-direction:column;gap:4px}
#money{font-size:1.7rem;font-weight:800;color:var(--gold)}
#carry,#rank{font-size:.95rem;font-weight:700;opacity:.95}
#tr{top:10px;right:12px;display:flex;gap:6px;pointer-events:auto}
#tr button{font:inherit;font-size:1.1rem;background:var(--panel);border:0;border-radius:999px;padding:7px 11px;color:#fff;cursor:pointer}
#banner{left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 16px;border-radius:12px;font-weight:800;font-size:1rem;white-space:nowrap;opacity:0;transition:opacity .3s}
#banner.on{opacity:1}
#hint{top:calc(78px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(20,120,60,.75);border:2px solid #22c55e;padding:7px 14px;border-radius:12px;font-weight:800;font-size:.92rem;white-space:nowrap;opacity:0;transition:opacity .3s;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#hint.on{opacity:1}
#banner{top:calc(118px + env(safe-area-inset-top,0px))}
#stam{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(60%,260px)}
#stam .bar{height:10px;background:rgba(0,0,0,.45);border-radius:999px;overflow:hidden}
#stam .fill{height:100%;width:100%;background:linear-gradient(90deg,#ff8a3d,#ffd23d);transition:width .15s}
#stam .lab{font-size:.75rem;font-weight:700;text-align:center;margin-top:3px;opacity:.9}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab3d{position:absolute;transform:translate(-50%,-100%);background:var(--panel);color:#fff;font-weight:800;font-size:.8rem;padding:4px 9px;border-radius:10px;white-space:nowrap;text-align:center;line-height:1.25;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.lab3d small{display:block;font-weight:600;opacity:.85;font-size:.72rem}
.lab3d.ok{border:2px solid #5ee38a}.lab3d.no{border:2px solid rgba(255,255,255,.15);opacity:.8}
.lab3d .pb{height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:4px;overflow:hidden}
.lab3d .pb i{display:block;height:100%;background:#5ee38a;width:0}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);display:none;pointer-events:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.75);transform:translate(-50%,-50%)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;background:rgba(6,12,24,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay h1{font-size:2.2rem;margin:0 0 10px;letter-spacing:-.03em}
.overlay p{margin:6px 0;line-height:1.55;max-width:24em;font-size:1rem}
.overlay .sub{opacity:.8;font-size:.9rem}
.steps{text-align:left;display:inline-block;margin:8px 0;font-size:.95rem;line-height:1.7}
.btn{margin-top:18px;padding:14px 40px;font:inherit;font-size:1.2rem;font-weight:800;border:0;border-radius:999px;background:var(--gold);color:#2a1a00;box-shadow:0 6px 0 #b98a1a;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b98a1a}
.hidden{display:none!important}
.dept{width:min(92vw,420px);text-align:left;font-size:.95rem}
.dept .sec{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin:8px 0;line-height:1.5}
.dept .ok{color:#5ee38a;font-weight:700}
.dept .act{display:block;width:100%;margin:6px 0;padding:9px 12px;font:inherit;font-size:.92rem;font-weight:700;text-align:left;border:0;border-radius:10px;background:#3d7bff;color:#fff;cursor:pointer}
.dept .act:disabled{background:rgba(255,255,255,.14);color:rgba(255,255,255,.55)}
.dept .act small{display:block;font-weight:500;opacity:.85;font-size:.78rem;margin-top:2px}
#dept.blink{animation:blink .7s infinite;background:#22c55e}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.9)}50%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
#deptArrow{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));right:14px;background:#22c55e;color:#062;font-weight:800;font-size:.85rem;padding:6px 10px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;animation:bob 1s infinite}
#deptArrow.on{opacity:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.dept label{display:block;margin:6px 0;font-weight:700}
.dept input[type=range]{width:100%;margin-top:4px}
.dept textarea{width:100%;box-sizing:border-box;margin-top:6px;font:inherit;font-size:.75rem;border-radius:8px;border:0;padding:6px;background:rgba(0,0,0,.35);color:#fff;resize:none}
.dept .row .act{margin:6px 0 0}
.labname{margin-top:8px;width:min(80vw,300px);font:inherit;font-size:1rem;font-weight:700;text-align:center;padding:10px 12px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;outline:none}
.labname:focus{border-color:var(--gold)}
#partyPop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,#ffd23d,#ff5fa2,#4fb3ff);color:#1a0a2e;font-weight:900;font-size:1.35rem;text-align:center;padding:16px 22px;border-radius:18px;box-shadow:0 0 40px rgba(255,255,255,.7);pointer-events:none;white-space:pre-line;line-height:1.5;z-index:5}
#partyPop.on{animation:partyIn 4.5s ease-out forwards}
@keyframes partyIn{0%{transform:translate(-50%,-50%) scale(0) rotate(-10deg)}10%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}15%{transform:translate(-50%,-50%) scale(1) rotate(0)}85%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
.hofrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08);border-radius:10px;margin:3px 0}
.hofrow .num{width:28px;text-align:center;font-weight:800;opacity:.7}
.hofrow .medal{font-size:1.9rem;width:40px;text-align:center;filter:drop-shadow(0 0 6px rgba(255,255,255,.6));animation:medalBob 1.6s ease-in-out infinite}
.hofrow.rank1{background:linear-gradient(120deg,#ffd700,#fff3b0,#ffb300,#ffe680,#ffd700);background-size:300% 100%;color:#3a2a00;animation:shimmer 3s linear infinite;box-shadow:0 0 18px rgba(255,215,0,.55)}
.hofrow.rank2{background:linear-gradient(120deg,#c0c0c0,#f4f4f4,#a8a8a8,#e8e8e8,#c0c0c0);background-size:300% 100%;color:#222;animation:shimmer 4s linear infinite;box-shadow:0 0 12px rgba(220,220,220,.45)}
.hofrow.rank3{background:linear-gradient(120deg,#cd7f32,#f0c9a0,#b06a25,#e6b07a,#cd7f32);background-size:300% 100%;color:#2a1600;animation:shimmer 5s linear infinite;box-shadow:0 0 10px rgba(205,127,50,.45)}
.hofrow.rank1 small,.hofrow.rank2 small,.hofrow.rank3 small{opacity:.85}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:300% 0}}
@keyframes medalBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(6deg)}}
.tabs{display:flex;gap:8px;margin:4px 0 8px}
.tab{font:inherit;font-weight:800;padding:8px 18px;border-radius:999px;border:2px solid rgba(255,255,255,.3);background:transparent;color:#fff}
.tab.on{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.3);margin-top:10px;padding:12px 30px;font-size:1.05rem}
.row,.bigrow{display:flex;gap:10px;align-items:stretch}
.bigrow{width:min(92vw,420px);gap:10px;margin:8px 0}
.bigact small{display:block;font-size:.7rem;line-height:1.2;margin-top:2px}
.bigact{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;font:inherit;font-size:1rem;font-weight:800;border:0;border-radius:16px;color:#fff;cursor:pointer}
.bigact .ico{font-size:2.2rem;line-height:1}
#fireTint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(255,60,0,.45) 100%);animation:fireFlick .25s infinite alternate}
#fireTint.on{opacity:1}
@keyframes fireFlick{from{filter:brightness(1)}to{filter:brightness(1.35)}}
#toast{position:absolute;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:700;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<template id="tpl-ko">
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="joy"><div id="knob"></div></div>
  <div class="hud" id="tl">
    <div id="money">$0</div>
    <div id="carry">📄 0 / 8</div>
    <div id="rank">학부연구생 · h 0</div>
  </div>
  <div class="hud" id="tr"><button id="dept" aria-label="학과">🏛</button><button id="mute" aria-label="소리">🔊</button><button id="menu" aria-label="메뉴">☰</button></div>
  <div class="hud" id="banner"></div>
  <div class="hud" id="hint"></div>
  <div class="hud" id="stam"><div class="bar"><div class="fill" id="stamFill"></div></div><div class="lab" id="stamLab">체력</div></div>
  <div id="toast"></div>
  <div id="fireTint"></div>
  <div id="partyPop"></div>

  <div id="start" class="overlay">
    <h1>🔬 연구실에서 살아남기</h1>
    <p class="sub">드래그 = 조이스틱 이동. 가까이 가면 자동으로 행동합니다.</p>
    <div class="steps">
      1. 실험 장비를 몽둥이로 두들겨 <b>데이터</b>를 뽑는다<br>
      2. 데이터를 <b>집필실</b>에 넣으면 대학원생이 <b>초고</b>를 쓴다<br>
      3. 초고를 <b>교수실</b>에 내면 리뷰 후 <b>연구비</b>가 나온다<br>
      4. 연구비로 학생·리뷰어·가방·몽둥이를 키우고 새 랩을 연다<br>
      5. 포닥이 되면 <b>석사생·박사생</b>을 · 조교수가 되면 <b>포닥·행정직원</b>을 고용해 랩을 자동화한다
    </div>
    <p class="sub">학기말마다 인건비가 나가고 연구원이 과로하면 떠납니다. 리젝은 다시 써야 하고 장비는 부서지면 15초 뒤 복구되며 체력이 떨어지면 커피가 필요합니다. 우상단 🏛에서 강의·세미나·과제 지원을 관리하세요.</p>
    <input id="labName" class="labname" maxlength="20" placeholder="연구실 이름 (예: AI 광공학 연구실)">
    <div class="row" style="width:min(88vw,360px);gap:10px;margin-top:14px"><button class="bigact" id="btnEasy" style="background:#2ecc71;color:#062"><span class="ico">🌱</span>이지 모드<small style="font-weight:600;opacity:.85">연습 · 랭킹 미등록</small></button><button class="bigact" id="btnStart" style="background:#ff5a5a"><span class="ico">🔥</span>헬조선 모드<small style="font-weight:600;opacity:.85">재난 · 신맵 · 랭킹</small></button></div>
    <p class="sub" id="modeNote"></p>
    <p class="sub" id="inappNote" style="display:none;color:#ffd23d">📵 인스타그램 앱 안 브라우저에서는 저장이 유지되지 않을 수 있어요. 오른쪽 위 ··· → "브라우저에서 열기"로 여세요.</p>
    <button class="btn ghost" id="btnRankStart">🏆 랭킹 보기</button>
    <p class="sub" id="verNote"></p>
    <p class="sub"><a href="#" id="langToggle" style="color:#fff">🇺🇸 English</a></p>
    <p class="sub">🏆 엔딩·파산·안식년 시점의 성적이 전체 랭킹에 연구실 이름으로 올라갑니다.</p>
    <p class="sub" id="saveNote"></p>
  </div>

  <div id="deptBox" class="overlay hidden" style="justify-content:flex-start;overflow-y:auto;padding-top:calc(24px + env(safe-area-inset-top,0px))">
    <h1 style="font-size:1.6rem">🏛 학과</h1>
    <div id="deptBody" class="dept"></div>
    <button class="btn" id="btnDeptClose">닫기</button>
  </div>
  <div id="deptArrow"></div>
  <div id="introBox" class="overlay hidden">
    <h1 style="font-size:1.7rem">🎓 조교수 승진!</h1>
    <p>이제 <b>과제 지원</b>이 열립니다. 우상단의 <b>🏛 학과</b> 버튼을 눌러야 지원할 수 있어요.</p>
    <p class="sub">과제 공고는 <b>학기 시작마다 50초</b>만 열립니다. 공고 중이면 🏛 버튼이 깜빡이고 화살표가 남은 시간을 보여줘요. 놓치면 다음 학기까지 기다려야 합니다.</p>
    <p class="sub">🏛에서는 강의 담당과 세미나 개최도 할 수 있습니다.</p>
    <button class="btn" id="btnIntro">확인 — 지금 공고 열림 (50초)</button>
  </div>
  <div id="hofBox" class="overlay hidden" style="justify-content:flex-start;overflow-y:auto;padding-top:calc(24px + env(safe-area-inset-top,0px))">
    <h1 style="font-size:1.6rem">🏆 랭킹</h1>
    <div class="tabs"><button class="tab on" id="tabWeek">이번 주</button><button class="tab" id="tabAll">역대</button></div>
    <div class="dept"><div class="sec" id="globalList"><small>불러오는 중…</small></div><small id="rankNote">월~일(한국시간) 기준 이번 주 최고의 연구실 · 연구실 이름 기준 최고 기록</small>
    <div class="sec" style="margin-top:14px"><b>📱 이 기기 기록</b><div id="hofList"></div></div></div>
    <button class="btn" id="btnHofClose">닫기</button>
  </div>
  <div id="statusBox" class="overlay hidden" style="justify-content:flex-start;overflow-y:auto;padding-top:calc(24px + env(safe-area-inset-top,0px))">
    <h1 style="font-size:1.5rem">🛠 개발자 현황</h1>
    <div class="dept" id="statusBody"></div>
    <button class="btn" id="btnStatusClose">닫기</button>
  </div>
  <div id="goBox" class="overlay hidden">
    <h1 id="goTitle" style="font-size:1.7rem"></h1>
    <div id="goBody" style="max-width:24em"></div>
    <button class="btn" id="btnGoRetry">재도전 (졸업생 보너스 유지)</button>
  </div>
  <div id="finalBox" class="overlay hidden" style="justify-content:flex-start;overflow-y:auto;padding-top:calc(40px + env(safe-area-inset-top,0px))">
    <h1 style="font-size:1.4rem;opacity:.8">🌌 누적 연구비 $30M 달성</h1>
    <div id="finalBody"></div>
    <button class="btn" id="btnFinalContinue">계속 운영하기</button>
    <button class="btn" id="btnFinalSabb" style="background:#4fb3ff;box-shadow:0 6px 0 #2a7ab8;color:#fff">안식년 떠나기</button>
  </div>
  <div id="endBox" class="overlay hidden">
    <h1>🏅 노벨상 수상</h1>
    <p>정교수 승진 · 국가전략과제 선정 · 랩 완전 확장. 살아남았습니다.</p>
    <p class="sub" id="endStats"></p>
    <button class="btn" id="btnEndContinue">계속 운영하기</button>
    <button class="btn" id="btnSabb" style="background:#4fb3ff;box-shadow:0 6px 0 #2a7ab8;color:#fff">안식년 떠나기 (랩 초기화 · 수익 +25% 영구)</button>
  </div>
  <div id="menuBox" class="overlay hidden" style="justify-content:flex-start;overflow-y:auto;padding-top:calc(24px + env(safe-area-inset-top,0px))">
    <h1>☰ <small style="font-size:.9rem;opacity:.7">v2.1.2</small></h1>
    <p id="menuStats"></p>
    <div class="dept">
      <div class="sec"><b>⚙️ 설정</b><br>
        <label>🔊 볼륨 <span id="volLab">100%</span><input type="range" id="volRange" min="0" max="1" step="0.05" value="1"></label>
        <label>⏩ 게임 속도 <span id="spdLab">1.0x</span><input type="range" id="spdRange" min="1" max="2" step="0.1" value="1"></label>
      </div>
      <div class="sec"><b>💾 저장</b> <small id="saveMsg"></small><br>
        <small>자동 저장은 이 기기·이 브라우저에만 남습니다. 다른 기기로 옮기려면 저장 코드를 복사해 두세요.</small>
        <textarea id="saveCode" rows="2" placeholder="저장 코드 (또는 developer- 명령)" spellcheck="false"></textarea>
        <div class="row"><button class="act" id="btnExport">저장 코드 복사</button><button class="act" id="btnImport" style="background:#22c55e">코드로 불러오기</button></div>
      </div>
    </div>
    <div class="row bigrow"><button class="bigact" id="btnRank" style="background:#ffc83d;color:#2a1a00"><span class="ico">🏆</span>랭킹 보기</button><button class="bigact" id="btnSaveClose" style="background:#3d7bff"><span class="ico">💾</span>저장하고 나가기</button><button class="bigact" id="btnQuit" style="background:#ff5a5a"><span class="ico">💣</span>연구실 폭파<small style="font-weight:600;opacity:.85">기록 등록 후 초기화</small></button></div>
    <button class="btn" id="btnResume">계속</button>
    <button class="btn" id="btnReset" style="background:#ff6b6b;box-shadow:0 6px 0 #b03a3a;color:#fff;margin-top:10px">처음부터</button>
  </div>
</div>

<script>
(function(){
if(!window.THREE){document.getElementById('saveNote').textContent='3D 엔진을 불러오지 못했습니다. 네트워크를 확인하고 새로고침하세요.';return;}
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const BGM={step:0,nextT:0,timer:null};
function tone(n,t,dur,type,g){const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(midi(n),t);v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+0.01);v.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(v);v.connect(MASTER);o.start(t);o.stop(t+dur+0.02);}
function bgmTick(){if(!AC||!S.running)return;const sd=60/SONG.bpm/4;while(BGM.nextT<AC.currentTime+0.2){const i=BGM.step%32,t=BGM.nextT;if(SONG.mel[i])tone(SONG.mel[i],t,sd*1.7,'triangle',0.05);if(SONG.bass[i])tone(SONG.bass[i],t,sd*2.2,'sine',0.11);tone(SONG.arp[i],t,sd*0.8,'square',0.012);BGM.step++;BGM.nextT+=sd;}}
function bgmStart(){if(!audio())return;if(AC.state==='suspended')AC.resume();BGM.nextT=AC.currentTime+0.05;if(!BGM.timer)BGM.timer=setInterval(bgmTick,50);}

function moveTo(w,x,z,dt,spd){spd*=speedMult()*effSpeed()*(w.kind==='pd'?1.15:1);const p=w.g.position;const dx=x-p.x,dz=z-p.z,d=Math.hypot(dx,dz);if(d<0.15)return true;const step=Math.min(d,spd*dt);p.x+=dx/d*step;p.z+=dz/d*step;w.g.rotation.y=Math.atan2(dx,dz);
  for(const ins of instruments){const ex=p.x-ins.x,ez=p.z-ins.z,e=Math.hypot(ex,ez),r=ins.type==='sync'?2.0:1.15;if(e<r&&e>0.001&&ins!==w.target){p.x=ins.x+ex/e*r;p.z=ins.z+ez/e*r;}}

function updateWorkers(dt){
  for(const w of workers.slice()){
    const p=w.g.position;
    w.exp+=dt;if(w.exp>=w.grad){graduate(w);continue;}
    if(S.fire){const f=S.fire.ins;const d=Math.hypot(f.x-p.x,f.z-p.z);if(d>2.6)moveTo(w,f.x,f.z,dt,4.5);else{w.g.rotation.y=Math.atan2(f.x-p.x,f.z-p.z);w.ch.ra.rotation.x=-1.3+Math.sin(S.t*25)*0.2;}w.el.style.display='none';continue;}
    if(S.blackout>0){w.ch.la.rotation.x=0;w.ch.ra.rotation.x=0;w.el.style.display='none';continue;}
    if(S.vacT>0){w.fat=Math.max(0,w.fat-10*dt);w.ch.la.rotation.x=-0.3;w.ch.ra.rotation.x=-0.3;p.y=Math.abs(Math.sin(S.t*3+w.ph))*0.05;w.el.style.display='none';continue;}
    w.fat=Math.min(100,w.fat+0.4*(w.fatRate||1)*(S.bonusT>0?2:1)*(S.labCoffee>0?0.7:1)*dt);
    if(S.quitCd>0&&w.fat>=99&&!EASY())w.fat=99;
    if(w.fat>=80&&!w.warned){w.warned=true;toast('😫 '+(w.kind==='ms'?'석사생':w.kind==='phd'?'박사생':'포닥')+' 피로 80% — 🏛에서 회식이나 휴가');}if(w.fat<60)w.warned=false;
    if(w.fat>=100&&EASY()){w.fat=0;w.rest=20;toast('😴 '+(w.kind==='ms'?'석사생':w.kind==='phd'?'박사생':'포닥')+'이 지쳐서 20초 휴식');continue;}
    if(w.rest>0){w.rest-=dt;w.ch.la.rotation.x=-0.3;w.ch.ra.rotation.x=-0.3;w.el.style.display='none';continue;}
    if(w.fat>=100&&S.quitCd>0)w.fat=99;
    if(w.fat>=100){S.quitCd=20;scene.remove(w.g);w.el.remove();workers.splice(workers.indexOf(w),1);S.lv[w.kind]=Math.max(0,S.lv[w.kind]-1);overworkQuit(w.kind==='ms'?'석사생':w.kind==='phd'?'박사생':'포닥');save();continue;}
    if(w.fat>=70){w.el.style.display='block';w.el.className='lab3d '+(w.fat>=90?'no':'ok');w.el.innerHTML=(w.fat>=90?'😵':'😫')+' 피로 '+Math.round(w.fat)+'%';projectLabel(w.el,p.x,2.3,p.z);}else w.el.style.display='none';
    if(w.kind==='ms'||w.kind==='pd'){
      if(w.state==='seek'){
        let best=null,bd=1e9;const topWing=S.wings.lastIndexOf(true);for(const ins of instruments){if(ins.broken||!S.wings[ins.wing])continue;if(w.kind==='ms'&&ins.wing>1)continue;const d=(ins.x-p.x)**2+(ins.z-p.z)**2+(w.kind==='pd'?(topWing-ins.wing)*400:0);if(d<bd){bd=d;best=ins;}}
        if(best){w.target=best;w.state='go';}else{w.wait-=dt;if(w.wait<=0){w.wait=2;w.target=null;}moveTo(w,-3+Math.sin(w.ph)*1.5,5,dt,2.2);}
      }else if(w.state==='go'){
        const ins=w.target;if(!ins||ins.broken){w.state=w.carry>0?'toDeposit':'seek';continue;}
        const rr=(ins.type==='sync'||ins.type==='hood'||ins.type==='gpu')?2.6:1.9;
        if(moveTo(w,ins.x,ins.z,dt,3.6)||Math.hypot(ins.x-p.x,ins.z-p.z)<rr){w.state='hit';w.t=0;}
      }else if(w.state==='hit'){
        const ins=w.target;if(!ins||ins.broken){w.state=w.carry>=w.cap||w.carry>0&&!instruments.some(i=>!i.broken&&S.wings[i.wing]&&(w.kind!=='ms'||i.wing<=1))?'toDeposit':'seek';continue;}
        w.g.rotation.y=Math.atan2(ins.x-p.x,ins.z-p.z);w.t+=dt;
        w.ch.ra.rotation.x=-Math.sin(clamp((w.t%0.7)/0.7,0,1)*Math.PI)*1.5;
        if(w.t>=(w.kind==='pd'?0.5:0.7)){w.t=0;ins.hp-=(w.kind==='pd'?2:1)+Math.floor(S.lv.club/2);ins.punch=1;
          if(ins.hp<=0){ins.hp=0;ins.broken=true;ins.repairT=15;const n=Math.min(Math.round(ins.def.drop*dropMult()),w.cap-w.carry);w.carry+=n;refreshWorkerStack(w);pop(ins.x,2.4,ins.z,'+'+n+(w.kind==='pd'?' (포닥)':' (석사생)'),'#9ff');w.state=w.carry>=w.cap-1?'toDeposit':'seek';}
        }

        w.ch.ra.rotation.x=0;
        if(moveTo(w,-6.5,3.6,dt,3.6)){w.t+=dt;if(w.t>=0.12&&w.carry>0){w.t=0;w.carry--;refreshWorkerStack(w);fly(new THREE.Vector3(p.x,1.4,p.z),new THREE.Vector3(-6.5,0.8,1.2),paperMatW,()=>{S.queue++;refreshPiles();},0.3);}
          if(w.carry<=0){w.state='seek';}}
      }
    }else{ // phd
      if(w.state==='toPickup'){
        if(moveTo(w,-10.5,3.6,dt,3.8)){w.t+=dt;if(w.t>=0.12&&S.pile>0&&w.carry<w.cap){w.t=0;S.pile--;refreshPiles();w.carry++;refreshWorkerStack(w);}
          if(w.carry>=w.cap||(w.carry>0&&S.pile<=0)){w.state='toDeliver';}}

          if(w.carry<=0)w.state='toPickup';}

function deptAction(a,k){

}

function moveTo(w,x,z,dt,spd){spd*=speedMult()*effSpeed()*(w.kind==='pd'?1.15:1);const p=w.g.position;const dx=x-p.x,dz=z-p.z,d=Math.hypot(dx,dz);if(d<0.15)return true;const step=Math.min(d,spd*dt);p.x+=dx/d*step;p.z+=dz/d*step;w.g.rotation.y=Math.atan2(dx,dz);
  for(const ins of instruments){const ex=p.x-ins.x,ez=p.z-ins.z,e=Math.hypot(ex,ez),r=ins.type==='sync'?2.0:1.15;if(e<r&&e>0.001&&ins!==w.target){p.x=ins.x+ex/e*r;p.z=ins.z+ez/e*r;}}
  w.ph+=dt;const wob=Math.sin(w.ph*13)*0.5;w.ch.ll.rotation.x=wob;w.ch.rl.rotation.x=-wob;p.y=Math.abs(Math.sin(w.ph*13))*0.05;return false;}
function refreshWorkerStack(w){for(let i=0;i<w.st.length;i++)w.st[i].visible=i<w.carry;}
function graduate(w){

  if(w.kind==='ms'){const m=30000+S.accepted*500;S.money+=m;toast('🎓 MS graduated! +'+fmt(m)+' · alumni bonus +2%');}
  else if(w.kind==='phd'){const m=80000+S.accepted*1000;S.money+=m;S.accepted+=1;toast('🎓 PhD graduated! Co-authored paper +1 · +'+fmt(m)+' · alumni bonus +2%');}
  else{const m=150000+S.accepted*1500;S.money+=m;S.accepted+=2;toast('🥼 Your postdoc got a faculty job! Co-authored papers +2 · +'+fmt(m)+' · bonus +2%');}
  beep(700,0.3,'triangle',0.06);setTimeout(()=>beep(1050,0.5,'triangle',0.06),160);save();
}
function updateWorkers(dt){
  for(const w of workers.slice()){
    const p=w.g.position;
    w.exp+=dt;if(w.exp>=w.grad){graduate(w);continue;}
    if(S.fire){const f=S.fire.ins;const d=Math.hypot(f.x-p.x,f.z-p.z);if(d>2.6)moveTo(w,f.x,f.z,dt,4.5);else{w.g.rotation.y=Math.atan2(f.x-p.x,f.z-p.z);w.ch.ra.rotation.x=-1.3+Math.sin(S.t*25)*0.2;}w.el.style.display='none';continue;}
    if(S.blackout>0){w.ch.la.rotation.x=0;w.ch.ra.rotation.x=0;w.el.style.display='none';continue;}
    if(S.vacT>0){w.fat=Math.max(0,w.fat-10*dt);w.ch.la.rotation.x=-0.3;w.ch.ra.rotation.x=-0.3;p.y=Math.abs(Math.sin(S.t*3+w.ph))*0.05;w.el.style.display='none';continue;}
    w.fat=Math.min(100,w.fat+0.4*(w.fatRate||1)*(S.bonusT>0?2:1)*(S.labCoffee>0?0.7:1)*dt);
    if(S.quitCd>0&&w.fat>=99&&!EASY())w.fat=99;
    if(w.fat>=80&&!w.warned){w.warned=true;toast('😫 '+(w.kind==='ms'?'MS student':w.kind==='phd'?'PhD student':'Postdoc')+' fatigue 80% — lab dinner or vacation in 🏛');}if(w.fat<60)w.warned=false;
    if(w.fat>=100&&EASY()){w.fat=0;w.rest=20;toast('😴 '+(w.kind==='ms'?'MS student':w.kind==='phd'?'PhD student':'Postdoc')+' is exhausted — resting 20s');continue;}
    if(w.rest>0){w.rest-=dt;w.ch.la.rotation.x=-0.3;w.ch.ra.rotation.x=-0.3;w.el.style.display='none';continue;}
    if(w.fat>=100&&S.quitCd>0)w.fat=99;
    if(w.fat>=100){S.quitCd=20;scene.remove(w.g);w.el.remove();workers.splice(workers.indexOf(w),1);S.lv[w.kind]=Math.max(0,S.lv[w.kind]-1);overworkQuit(w.kind==='ms'?'MS student':w.kind==='phd'?'PhD student':'Postdoc');save();continue;}
    if(w.fat>=70){w.el.style.display='block';w.el.className='lab3d '+(w.fat>=90?'no':'ok');w.el.innerHTML=(w.fat>=90?'😵':'😫')+' fatigue '+Math.round(w.fat)+'%';projectLabel(w.el,p.x,2.3,p.z);}else w.el.style.display='none';
    if(w.kind==='ms'||w.kind==='pd'){
      if(w.state==='seek'){
        let best=null,bd=1e9;const topWing=S.wings.lastIndexOf(true);for(const ins of instruments){if(ins.broken||!S.wings[ins.wing])continue;if(w.kind==='ms'&&ins.wing>1)continue;const d=(ins.x-p.x)**2+(ins.z-p.z)**2+(w.kind==='pd'?(topWing-ins.wing)*400:0);if(d<bd){bd=d;best=ins;}}
        if(best){w.target=best;w.state='go';}else{w.wait-=dt;if(w.wait<=0){w.wait=2;w.target=null;}moveTo(w,-3+Math.sin(w.ph)*1.5,5,dt,2.2);}
      }else if(w.state==='go'){
        const ins=w.target;if(!ins||ins.broken){w.state=w.carry>0?'toDeposit':'seek';continue;}
        const rr=(ins.type==='sync'||ins.type==='hood'||ins.type==='gpu')?2.6:1.9;
        if(moveTo(w,ins.x,ins.z,dt,3.6)||Math.hypot(ins.x-p.x,ins.z-p.z)<rr){w.state='hit';w.t=0;}
      }else if(w.state==='hit'){
        const ins=w.target;if(!ins||ins.broken){w.state=w.carry>=w.cap||w.carry>0&&!instruments.some(i=>!i.broken&&S.wings[i.wing]&&(w.kind!=='ms'||i.wing<=1))?'toDeposit':'seek';continue;}
        w.g.rotation.y=Math.atan2(ins.x-p.x,ins.z-p.z);w.t+=dt;
        w.ch.ra.rotation.x=-Math.sin(clamp((w.t%0.7)/0.7,0,1)*Math.PI)*1.5;
        if(w.t>=(w.kind==='pd'?0.5:0.7)){w.t=0;ins.hp-=(w.kind==='pd'?2:1)+Math.floor(S.lv.club/2);ins.punch=1;
          if(ins.hp<=0){ins.hp=0;ins.broken=true;ins.repairT=15;const n=Math.min(Math.round(ins.def.drop*dropMult()),w.cap-w.carry);w.carry+=n;refreshWorkerStack(w);pop(ins.x,2.4,ins.z,'+'+n+(w.kind==='pd'?' (postdoc)':' (MS)'),'#9ff');w.state=w.carry>=w.cap-1?'toDeposit':'seek';}
        }
      }else if(w.state==='toDeposit'){
        w.ch.ra.rotation.x=0;
        if(moveTo(w,-6.5,3.6,dt,3.6)){w.t+=dt;if(w.t>=0.12&&w.carry>0){w.t=0;w.carry--;refreshWorkerStack(w);fly(new THREE.Vector3(p.x,1.4,p.z),new THREE.Vector3(-6.5,0.8,1.2),paperMatW,()=>{S.queue++;refreshPiles();},0.3);}
          if(w.carry<=0){w.state='seek';}}
      }
    }else{ // phd
      if(w.state==='toPickup'){
        if(moveTo(w,-10.5,3.6,dt,3.8)){w.t+=dt;if(w.t>=0.12&&S.pile>0&&w.carry<w.cap){w.t=0;S.pile--;refreshPiles();w.carry++;refreshWorkerStack(w);}
          if(w.carry>=w.cap||(w.carry>0&&S.pile<=0)){w.state='toDeliver';}}
      }else{
        if(moveTo(w,9,1.6,dt,3.8)){w.t+=dt;if(w.t>=0.12&&w.carry>0){w.t=0;w.carry--;refreshWorkerStack(w);fly(new THREE.Vector3(p.x,1.4,p.z),new THREE.Vector3(12.2,1.0,-1),paperMatY,()=>{S.rev++;},0.35);}
          if(w.carry<=0)w.state='toPickup';}
      }
    }
  }
}

function updateFire(dt){

function armButton(btn,fn){let armed=false,h=null;const orig=btn.textContent;btn.addEventListener('click',()=>{if(!armed){armed=true;btn.textContent='Sure? Tap again within 3s';h=setTimeout(()=>{armed=false;btn.textContent=orig;},3000);return;}clearTimeout(h);btn.textContent=orig;armed=false;fn();});}
// export / import save code
function exportCode(){save();try{return btoa(unescape(encodeURIComponent(localStorage.getItem(SAVE_KEY())||'')));}catch(e){return '';}}
function importCode(code){try{const j=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));if(!j||typeof j.accepted!=='number')throw 0;localStorage.setItem(SAVE_KEY(),JSON.stringify(j));return true;}catch(e){return false;}}
/* ---------------- loop ---------------- */
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000)*0.8*SET.spd;last=now;if(S.running)update(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}

function chooseMode(m){if(m!==MODE){NOSAVE=true;try{localStorage.setItem('lab_mode',m);}catch(e){}location.reload();return;}start();}
function start(){const raw=($('labName').value||'').trim();const code=raw.toLowerCase();const cheat=code==='developer-ending'?'final':code==='developer-nobel'?'nobel':code==='developer-nature'?'nature':code==='developer-status'?'status':null;
  if(!cheat&&raw)S.labName=raw;if(!S.labName)S.labName='Our Lab';$('labName').value=S.labName;save();S.running=true;
  if(cheat==='status'){S.running=false;showStatus();return;}
  if(cheat==='final')setTimeout(showFinal,300);else if(cheat==='nobel')setTimeout(showEnding,300);else if(cheat==='nature')setTimeout(()=>startParty('nature'),300);$('start').classList.add('hidden');bgmStart();beep(660,0.1,'triangle',0.04);}
$('btnStart').addEventListener('click',()=>chooseMode('hard'));$('btnEasy').addEventListener('click',()=>chooseMode('easy'));
$('btnSaveClose').addEventListener('click',()=>{save();toast('💾 Saved — you can close the window now');$('menuBox').classList.add('hidden');S.running=true;last=performance.now();});
if(/Instagram|FBAN|FBAV|KAKAOTALK|NAVER\(|Line\//i.test(navigator.userAgent||''))$('inappNote').style.display='block';
$('modeNote').textContent=EASY()?'Current: 🌱 Easy Mode — practice without disasters, new maps or ranking':'Current: 🔥 Hell Mode — blackouts, fires, floods · new maps · ranking';
$('mute').addEventListener('click',()=>{audio();setMute(!muted);});
$('menu').addEventListener('click',()=>{S.running=false;$('volRange').value=SET.vol;$('volLab').textContent=Math.round(SET.vol*100)+'%';$('spdRange').value=SET.spd;$('spdLab').textContent=SET.spd.toFixed(1)+'x';$('saveMsg').textContent=lastSaved?'Last saved '+lastSaved.toLocaleTimeString():'';$('menuStats').innerHTML='Papers '+S.accepted+' · Rejects '+S.rejected+' · accept '+Math.round(acceptRate()*100)+'%<br>Writers '+students()+' · Reviewers '+reviewers()+' · Bag '+cap()+' · Club '+dmg()+'<br>MS students '+S.lv.ms+' · PhD '+S.lv.phd+' · Postdocs '+S.lv.pd+'<br>🌟 Nature (incl. sister journals) '+S.natures+'';$('menuBox').classList.remove('hidden');});
$('btnResume').addEventListener('click',()=>{$('menuBox').classList.add('hidden');S.running=true;last=performance.now();});
armButton($('btnReset'),()=>{NOSAVE=true;try{localStorage.removeItem(SAVE_KEY());}catch(e){}location.reload();});
$('volRange').addEventListener('input',e=>{SET.vol=+e.target.value;$('volLab').textContent=Math.round(SET.vol*100)+'%';if(MASTER&&!muted)MASTER.gain.setTargetAtTime(SET.vol,AC.currentTime,0.05);saveSettings();});
$('spdRange').addEventListener('input',e=>{SET.spd=+e.target.value;$('spdLab').textContent=SET.spd.toFixed(1)+'x';saveSettings();});
$('btnExport').addEventListener('click',()=>{const code=exportCode();$('saveCode').value=code;$('saveCode').select();let ok=false;try{document.execCommand('copy');ok=true;}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>{$('saveMsg').textContent='Copied — paste it somewhere safe';}).catch(()=>{$('saveMsg').textContent=ok?'Copied':'Long-press the code below to copy';});else $('saveMsg').textContent=ok?'Copied':'Long-press the code below to copy';});
function devCommand(c){
  c=c.trim().toLowerCase();if(!c.startsWith('developer-'))return false;
  const k=c.slice(10);$('menuBox').classList.add('hidden');S.running=true;last=performance.now();
  if(k==='nature')startParty('nature');else if(k==='sister')startParty('sister');
  else if(k==='fire'){if(!S.fire)startFire();}
  else if(k==='dark'||k==='blackout'){S.blackout=15;S.event={k:'dark',t:15,msg:'⚡ Blackout! Only your flashlight works'};}
  else if(k==='flood')startFlood();
  else if(k==='ending')showFinal();else if(k==='nobel')showEnding();else if(k==='status'){S.running=false;showStatus();}
  else if(k==='money'){S.money+=1000000;toast('💰 +$1M');}
  else if(k==='papers'){S.accepted+=10;toast('📄 Papers +10');}
  else if(k==='call'){S.call={t:50};toast('📜 Grant call forced open');}
  else if(k==='open'){[1,2,3,4].forEach(i=>{if(!S.wings[i])openWing(WINGS[i],i);});}
  else if(k==='hire'){['ms','ms','phd','pd'].forEach(x=>{S.lv[x]++;spawnWorker(x);});S.lv.admin=1;spawnAdmin();}
  else{toast('❓ Unknown developer command: '+k);return true;}
  toast('🛠 '+c);return true;
}
armButton($('btnImport'),()=>{if(devCommand($('saveCode').value)){$('saveCode').value='';return;}if(importCode($('saveCode').value)){NOSAVE=true;$('saveMsg').textContent='Loading…';location.reload();}else $('saveMsg').textContent='Invalid code';});

$('verNote').textContent='v'+VERSION;logVisit();try{const fl=localStorage.getItem('lab_flash');if(fl==='sabb'){localStorage.removeItem('lab_flash');$('saveNote').textContent='🏝️ Back from sabbatical — new lab · income +'+(S.sabb*25)+'% · alumni bonus kept';}}catch(e){}$('langToggle').addEventListener('click',e=>{e.preventDefault();try{localStorage.setItem('lab_lang',LANG==='ko'?'en':'ko');}catch(err){}location.reload();});
if(load()){$('labName').value=S.labName||'';$('saveNote').textContent=(EASY()?'[Easy] ':'[Hell] ')+'Saved progress loaded — Papers '+S.accepted+' · '+fmt(S.money);}
resize();layoutStudents();layoutProfs();applyWings();refreshPiles();refreshStack();setMute(muted);
for(let i=0;i<S.lv.ms;i++)spawnWorker('ms');for(let i=0;i<S.lv.phd;i++)spawnWorker('phd');for(let i=0;i<S.lv.pd;i++)spawnWorker('pd');if(S.lv.admin>0)spawnAdmin();
camera.position.set(0,21,19.5);camera.lookAt(0,0.5,1.5);
requestAnimationFrame(loop);
})();
</script></template>
<script>
(function(){
  let lang='';try{lang=localStorage.getItem('lab_lang')||'';}catch(e){}
  const q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='ko'){lang=q;try{localStorage.setItem('lab_lang',q);}catch(e){}}
  if(lang!=='ko'&&lang!=='en'){lang=/-en(\b|\.)/.test(location.hostname)?'en':(/\.vercel\.app$/.test(location.hostname)?'ko':((navigator.language||'').toLowerCase().startsWith('ko')?'ko':'en'));}
  document.documentElement.lang=lang;document.title=lang==='en'?'Lab Survival':'연구실에서 살아남기';
  const tpl=document.getElementById('tpl-'+lang);const frag=tpl.content.cloneNode(true);
  const scripts=Array.from(frag.querySelectorAll('script'));scripts.forEach(s=>s.remove());
  document.body.appendChild(frag);
  scripts.forEach(s=>{const n=document.createElement('script');n.textContent=s.textContent;document.body.appendChild(n);});
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
